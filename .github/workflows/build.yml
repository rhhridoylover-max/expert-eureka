name: Build AAB Auto V3 - Direct ZIP Upload
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip if ZIP uploaded
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "ZIP found, unzipping..."
            unzip -o "*.zip" || unzip -o *.ZIP || true
            for f in *.zip; do unzip -o "$f"; done
            rm -f *.zip || true
            ls -la
          fi
          if [ -d "earning-live-FIXED" ]; then
            mv earning-live-FIXED/* . || true
          fi

      - name: Install dependencies
        run: |
          npm install expo-secure-store expo-status-bar
          npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
